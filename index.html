<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Calculadora</title>
</head>

<body>
    <main>
        <div class="calculator">
            <input type="text" class="display" readonly>
            <div class="buttons">
                <button class="clear" data-value="clear">C</button>
                <button class="delete" data-value="delete">DEL</button>
                <button class="operator" data-value="/">÷</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">-</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="equal" data-value="=">=</button>

                <button class="zero" data-value="0">0</button>
                <button data-value=".">.</button>

            </div>
        </div>
    </main>

</body>

</html>
